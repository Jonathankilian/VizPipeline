[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vizpipeline"
version = "0.1.0"
description = "Generalistic visualization pipeline for pandas DataFrames"
readme = "VizPipeline_Implementation_Plan.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    "pandas>=1.5",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

